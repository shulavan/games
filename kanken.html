<script>
const PRIMARY_JSON_URL = 'https://shulavan.github.io/data/kanken.json';
const FALLBACK_JSON_URL = 'kanken.json';
​const audio = {
ctx: null,
enabled: true,
​init() {
if (!this.ctx) {
const AudioCtx = window.AudioContext || window.webkitAudioContext;
if (AudioCtx) this.ctx = new AudioCtx();
}
if (this.ctx && this.ctx.state === 'suspended') {
this.ctx.resume().catch(() => {});
}
},
​playTone(freq, duration, type = 'sine', delay = 0) {
if (!this.enabled) return;
try {
this.init();
if (!this.ctx) return;
const osc = this.ctx.createOscillator();
const gain = this.ctx.createGain();
​osc.type = type;
osc.frequency.setValueAtTime(freq, this.ctx.currentTime + delay);
​gain.gain.setValueAtTime(0.15, this.ctx.currentTime + delay);
gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + delay + duration);
​osc.connect(gain);
gain.connect(this.ctx.destination);
​osc.start(this.ctx.currentTime + delay);
osc.stop(this.ctx.currentTime + delay + duration);
} catch (e) {
console.warn("Audio error:", e);
}
},
​playPinpon() {
this.playTone(660, 0.25, 'sine', 0);
this.playTone(880, 0.35, 'sine', 0.15);
},
​playBubboo() {
this.playTone(150, 0.2, 'sawtooth', 0);
this.playTone(140, 0.3, 'sawtooth', 0.15);
},
​playDeden() {
this.playTone(440, 0.15, 'triangle', 0);
}
};
​let quizBank = null;
let currentLevel = "2";
let currentQuestionIndex = 0;
let questions = [];
let userResults = [];
let strokeData = [];
let currentStroke = [[], [], []];
let strokeStartTime = 0;
let autoSubmitTimer = null;
let isEvaluating = false;
let resultCountdownInterval = null;
let isPaused = false;
​const canvas = document.getElementById('handwriting-canvas');
const ctx = canvas.getContext('2d');
​// 指定URLのJSONデータをフェッチし、失敗した場合はローカルにフォールバックする
async function loadQuizBankJSON() {
if (quizBank) return true;
try {
const response = await fetch(PRIMARY_JSON_URL);
if (!response.ok) throw new Error(Primary fetch failed: ${response.status});
quizBank = await response.json();
document.getElementById('loading-error-msg').classList.add('hidden');
return true;
} catch (primaryErr) {
console.warn("Primary JSON fetch error, trying fallback:", primaryErr);
try {
const fallbackResponse = await fetch(FALLBACK_JSON_URL);
if (!fallbackResponse.ok) throw new Error(Fallback fetch failed: ${fallbackResponse.status});
quizBank = await fallbackResponse.json();
document.getElementById('loading-error-msg').classList.add('hidden');
return true;
} catch (fallbackErr) {
console.error("JSON fetch completely failed:", fallbackErr);
document.getElementById('loading-error-msg').classList.remove('hidden');
return false;
}
}
}
​// 音読み・訓読みを【交互】に選び、必ず全10問を生成するロジック（例文被り防止つき）
function generateGameQuestions(level) {
const rawSentences = (quizBank && quizBank[level]) ? quizBank[level] : [];
​const onyomiPool = [];
const kunyomiPool = [];
​rawSentences.forEach((sentenceObj, sentenceIdx) => {
if (!sentenceObj.words) return;
sentenceObj.words.forEach(wordObj => {
if (!wordObj.kanjis) return;
wordObj.kanjis.forEach(kanjiObj => {
const item = {
sentenceIndex: sentenceIdx,
fullSentence: sentenceObj.sentence,
wordText: wordObj.word,
wordReading: wordObj.reading,
targetChar: kanjiObj.char,
targetReading: kanjiObj.reading,
type: kanjiObj.type
};
​if (kanjiObj.type === '音読み') {
onyomiPool.push(item);
} else if (kanjiObj.type === '訓読み') {
kunyomiPool.push(item);
}
});
});
});
​const shuffle = (array) => {
for (let i = array.length - 1; i > 0; i--) {
const j = Math.floor(Math.random() * (i + 1));
[array[i], array[j]] = [array[j], array[i]];
}
};
​shuffle(onyomiPool);
shuffle(kunyomiPool);
​const usedSentenceIndices = new Set();
const usedCharSet = new Set();
const selectedOnyomi = [];
const selectedKunyomi = [];
​for (const item of onyomiPool) {
if (selectedOnyomi.length >= 5) break;
if (!usedSentenceIndices.has(item.sentenceIndex) && !usedCharSet.has(item.targetChar)) {
usedSentenceIndices.add(item.sentenceIndex);
usedCharSet.add(item.targetChar);
selectedOnyomi.push(item);
}
}
if (selectedOnyomi.length < 5) {
for (const item of onyomiPool) {
if (selectedOnyomi.length >= 5) break;
if (!usedCharSet.has(item.targetChar)) {
usedCharSet.add(item.targetChar);
selectedOnyomi.push(item);
}
}
}
​for (const item of kunyomiPool) {
if (selectedKunyomi.length >= 5) break;
if (!usedSentenceIndices.has(item.sentenceIndex) && !usedCharSet.has(item.targetChar)) {
usedSentenceIndices.add(item.sentenceIndex);
usedCharSet.add(item.targetChar);
selectedKunyomi.push(item);
}
}
if (selectedKunyomi.length < 5) {
for (const item of kunyomiPool) {
if (selectedKunyomi.length >= 5) break;
if (!usedCharSet.has(item.targetChar)) {
usedCharSet.add(item.targetChar);
selectedKunyomi.push(item);
}
}
}
​const interleaved = [];
const maxLen = Math.max(selectedOnyomi.length, selectedKunyomi.length);
​for (let i = 0; i < maxLen; i++) {
if (i < selectedOnyomi.length) interleaved.push(selectedOnyomi[i]);
if (i < selectedKunyomi.length) interleaved.push(selectedKunyomi[i]);
}
​return interleaved.slice(0, 10).map(item => {
const formattedSentence = replaceTargetKanjiWithReading(
item.fullSentence,
item.wordText,
item.targetChar,
item.targetReading
);
return { ...item, displaySentence: formattedSentence };
});
}
​function replaceTargetKanjiWithReading(sentence, wordText, targetChar, targetReading) {
const wordIdx = sentence.indexOf(wordText);
if (wordIdx !== -1) {
const charInWordIdx = wordText.indexOf(targetChar);
if (charInWordIdx !== -1) {
const globalIdx = wordIdx + charInWordIdx;
const before = sentence.slice(0, globalIdx);
const after = sentence.slice(globalIdx + targetChar.length);
const highlight = <span class="text-indigo-600 font-black underline underline-offset-4 decoration-indigo-500 decoration-4">${targetReading}</span>;
return before + highlight + after;
}
}
return sentence.replace(
targetChar,
<span class="text-indigo-600 font-black underline underline-offset-4 decoration-indigo-500 decoration-4">${targetReading}</span>
);
}
​function setUIBusy(busy) {
isEvaluating = busy;
document.getElementById('submit-btn').disabled = busy;
document.getElementById('clear-btn').disabled = busy;
document.getElementById('undo-btn').disabled = busy;
}
​function initCanvas() {
ctx.lineWidth = 10;
ctx.lineCap = 'round';
ctx.lineJoin = 'round';
ctx.strokeStyle = '#0f172a';
}
​function clearCanvas() {
ctx.clearRect(0, 0, canvas.width, canvas.height);
strokeData = [];
currentStroke = [[], [], []];
if (autoSubmitTimer) clearTimeout(autoSubmitTimer);
}
​function undoStroke() {
if (isEvaluating || strokeData.length === 0) return;
if (autoSubmitTimer) clearTimeout(autoSubmitTimer);
strokeData.pop();
currentStroke = [[], [], []];
redrawCanvas();
}
​function redrawCanvas() {
ctx.clearRect(0, 0, canvas.width, canvas.height);
strokeData.forEach(stroke => {
const xs = stroke[0];
const ys = stroke[1];
if (!xs || xs.length === 0) return;
​ctx.beginPath();
ctx.moveTo(xs[0], ys[0]);
for (let i = 1; i < xs.length; i++) {
ctx.lineTo(xs[i], ys[i]);
}
ctx.stroke();
});
}
​function getCanvasCoords(e) {
const rect = canvas.getBoundingClientRect();
const scaleX = canvas.width / rect.width;
const scaleY = canvas.height / rect.height;
const clientX = e.touches ? e.touches[0].clientX : e.clientX;
const clientY = e.touches ? e.touches[0].clientY : e.clientY;
​return {
x: Math.round((clientX - rect.left) * scaleX),
y: Math.round((clientY - rect.top) * scaleY)
};
}
​function startDrawing(e) {
if (isEvaluating) return;
e.preventDefault();
if (autoSubmitTimer) clearTimeout(autoSubmitTimer);
​const { x, y } = getCanvasCoords(e);
strokeStartTime = Date.now();
currentStroke = [[x], [y], [0]];
​ctx.beginPath();
ctx.moveTo(x, y);
}
​function draw(e) {
if (isEvaluating || currentStroke[0].length === 0) return;
e.preventDefault();
​const { x, y } = getCanvasCoords(e);
const timeOffset = Date.now() - strokeStartTime;
​currentStroke[0].push(x);
currentStroke[1].push(y);
currentStroke[2].push(timeOffset);
​ctx.lineTo(x, y);
ctx.stroke();
}
​function stopDrawing(e) {
if (isEvaluating || currentStroke[0].length === 0) return;
​strokeData.push(currentStroke);
currentStroke = [[], [], []];
​autoSubmitTimer = setTimeout(() => {
if (strokeData.length > 0 && !isEvaluating) {
evaluateAnswer();
}
}, 1800);
}
​canvas.addEventListener('mousedown', startDrawing);
canvas.addEventListener('mousemove', draw);
canvas.addEventListener('mouseup', stopDrawing);
canvas.addEventListener('mouseleave', stopDrawing);
​canvas.addEventListener('touchstart', startDrawing, { passive: false });
canvas.addEventListener('touchmove', draw, { passive: false });
canvas.addEventListener('touchend', stopDrawing);
​async function evaluateAnswer() {
if (isEvaluating || strokeData.length === 0) return;
setUIBusy(true);
if (autoSubmitTimer) clearTimeout(autoSubmitTimer);
​const currentQ = questions[currentQuestionIndex];
const targetChar = currentQ.targetChar;
​try {
const payload = {
options: 'enable_homework_open_search',
requests: [{
writing_guide: { writing_area_width: 400, writing_area_height: 400 },
ink: strokeData,
language: 'ja'
}]
};
​const response = await fetch('https://inputtools.google.com/request?itc=ja-t-i0-handwrit&app=autodraw', {
method: 'POST',
headers: { 'Content-Type': 'application/json' },
body: JSON.stringify(payload)
});
​const data = await response.json();
let isCorrect = false;
​if (data[0] === 'SUCCESS' && data[1] && data[1][0] && data[1][0][1]) {
const candidates = data[1][0][1];
isCorrect = candidates.slice(0, 20).includes(targetChar);
}
​showFeedback(isCorrect, targetChar);
​} catch (err) {
console.error("文字認識エラー:", err);
showFeedback(false, targetChar);
}
}
​function showFeedback(isCorrect, targetChar) {
const overlay = document.getElementById('feedback-overlay');
const symbol = document.getElementById('feedback-symbol');
const answerDisplay = document.getElementById('correct-answer-display');
​userResults.push({
question: questions[currentQuestionIndex],
isCorrect: isCorrect
});
​overlay.classList.remove('hidden');
​if (isCorrect) {
symbol.textContent = '◯';
symbol.className = 'text-7xl sm:text-8xl font-black text-red-500 pop-in';
answerDisplay.classList.add('hidden');
audio.playPinpon();
} else {
symbol.textContent = '✕';
symbol.className = 'text-7xl sm:text-8xl font-black text-blue-600 pop-in';
answerDisplay.textContent = 正解：${targetChar};
answerDisplay.classList.remove('hidden');
audio.playBubboo();
}
​setTimeout(() => {
overlay.classList.add('hidden');
currentQuestionIndex++;
if (currentQuestionIndex < questions.length) {
loadQuestion();
} else {
showResults();
}
}, 1400);
}
​async function startGame() {
try {
// 1. ユーザーのタップ/クリックイベントの直下で即座にフルスクリーン化を呼び出す（User Activation保持）
requestFullScreen();
​// 2. その後に非同期のJSON読み込み処理を実行する
const isLoaded = await loadQuizBankJSON();
if (!isLoaded) return;
​const levelInput = document.querySelector('input[name="level-select"]:checked');
currentLevel = levelInput ? levelInput.value : "2";
​audio.init();
​document.getElementById('start-modal').classList.add('hidden');
document.getElementById('level-badge').textContent = 漢検 ${currentLevel === '1' ? '１' : '２'}級;
​questions = generateGameQuestions(currentLevel);
currentQuestionIndex = 0;
userResults = [];
​initCanvas();
loadQuestion();
} catch (err) {
console.error("Game start error:", err);
}
}
​function loadQuestion() {
setUIBusy(false);
clearCanvas();
​document.getElementById('question-progress').textContent = 第 ${currentQuestionIndex + 1} / ${questions.length} 問;
​const currentQ = questions[currentQuestionIndex];
​const badgeEl = document.getElementById('reading-type-badge');
const instructionEl = document.getElementById('instruction-text');
​// 問題種別に応じてバッジカラーと右側の補助説明文を動的に切り替える
if (currentQ.type === '音読み') {
badgeEl.textContent = '【音読み】問題';
badgeEl.className = 'text-[11px] font-black px-2 py-0.5 rounded-md bg-indigo-100 text-indigo-700 border border-indigo-200 shrink-0';
if (instructionEl) instructionEl.textContent = '下線カタカナ部分の漢字を書いてください';
} else {
badgeEl.textContent = '【訓読み】問題';
badgeEl.className = 'text-[11px] font-black px-2 py-0.5 rounded-md bg-amber-100 text-amber-800 border border-amber-200 shrink-0';
if (instructionEl) instructionEl.textContent = '下線ひらがな部分の漢字を書いてください';
}
​document.getElementById('question-text').innerHTML = currentQ.displaySentence;
audio.playDeden();
}
​function showResults() {
const resultModal = document.getElementById('result-modal');
const tbody = document.getElementById('result-table-body');
tbody.innerHTML = '';
​let correctCount = 0;
​userResults.forEach((res, index) => {
if (res.isCorrect) correctCount++;
​const tr = document.createElement('tr');
tr.className = res.isCorrect ? 'bg-red-50/40 hover:bg-red-50/70 transition' : 'bg-slate-50/50 hover:bg-slate-100/70 transition';
​const qTypeBadge = res.question.type === '音読み'
? '<span class="text-[10px] px-2 py-0.5 rounded font-bold bg-indigo-100 text-indigo-700 border border-indigo-200">音読み</span>'
: '<span class="text-[10px] px-2 py-0.5 rounded font-bold bg-amber-100 text-amber-800 border border-amber-200">訓読み</span>';
​const statusBadge = res.isCorrect
? '<span class="inline-flex items-center justify-center px-2 py-0.5 rounded-full text-xs font-black bg-red-100 text-red-600 border border-red-200">◯ 正解</span>'
: '<span class="inline-flex items-center justify-center px-2 py-0.5 rounded-full text-xs font-black bg-slate-200 text-slate-600 border border-slate-300">✕ 不正解</span>';
​tr.innerHTML = <td class="py-2.5 px-2 text-center text-slate-400 font-bold">${index + 1}</td> <td class="py-2.5 px-2 text-center">${statusBadge}</td> <td class="py-2.5 px-3 font-bold text-slate-800"> <span class="text-indigo-900 text-base font-black mr-1.5">${res.question.targetChar}</span> <span class="text-xs text-slate-600 font-medium">(${res.question.wordText} - ${res.question.wordReading})</span> </td> <td class="py-2.5 px-2 text-center">${qTypeBadge}</td>;
tbody.appendChild(tr);
});
​const score = correctCount * 10;
document.getElementById('final-score-display').innerHTML = ${score} <span class="text-base text-slate-600">/ 100 点</span>;
​resultModal.classList.remove('hidden');
​let countdown = 10;
isPaused = false;
const countdownEl = document.getElementById('countdown-num');
const progressEl = document.getElementById('auto-close-progress');
const pauseBtn = document.getElementById('pause-btn');
​countdownEl.textContent = countdown;
progressEl.style.width = '100%';
pauseBtn.textContent = '一時停止';
​if (resultCountdownInterval) clearInterval(resultCountdownInterval);
​resultCountdownInterval = setInterval(() => {
if (isPaused) return;
countdown--;
if (countdown >= 0) {
countdownEl.textContent = countdown;
progressEl.style.width = ${(countdown / 10) * 100}%;
}
if (countdown <= 0) {
clearInterval(resultCountdownInterval);
restartGame();
}
}, 1000);
}
​function pauseCountdown() {
isPaused = !isPaused;
const pauseBtn = document.getElementById('pause-btn');
pauseBtn.textContent = isPaused ? '再開' : '一時停止';
}
​function restartGame() {
if (resultCountdownInterval) clearInterval(resultCountdownInterval);
document.getElementById('result-modal').classList.add('hidden');
document.getElementById('start-modal').classList.remove('hidden');
}
​function requestFullScreen() {
try {
const elem = document.documentElement;
if (elem.requestFullscreen) {
elem.requestFullscreen().catch(() => {});
} else if (elem.webkitRequestFullscreen) {
elem.webkitRequestFullscreen();
} else if (elem.msRequestFullscreen) {
elem.msRequestFullscreen();
}
} catch (err) {
console.log("Fullscreen not available:", err);
}
}
​function toggleFullScreen() {
if (!document.fullscreenElement && !document.webkitFullscreenElement) {
requestFullScreen();
} else {
if (document.exitFullscreen) {
document.exitFullscreen();
} else if (document.webkitExitFullscreen) {
document.webkitExitFullscreen();
}
}
}
​function toggleSound() {
audio.enabled = !audio.enabled;
document.getElementById('sound-icon').textContent = audio.enabled ? '🔊' : '🔇';
}
​window.addEventListener('load', () => {
initCanvas();
loadQuizBankJSON();
});
</script>
</body>
</html>
