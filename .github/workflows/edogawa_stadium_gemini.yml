name: Edogawa Stadium Gemini Pilot

on:
  workflow_dispatch:
    inputs:
      year:
        description: "対象年（空欄なら今月）"
        required: false
        type: string
      month:
        description: "対象月（空欄なら今月）"
        required: false
        type: string
  schedule:
    - cron: "17 2 1 * *" # 毎月1日 11:17 JST

permissions:
  contents: read

jobs:
  analyze-stadium-schedule:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pilot dependencies
        run: pip install -r requirements-gemini.txt
      - name: Run Gemini URL Context analysis
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite
          INPUT_YEAR: ${{ inputs.year }}
          INPUT_MONTH: ${{ inputs.month }}
        run: |
          args=()
          if [ -n "$INPUT_YEAR" ]; then args+=(--year "$INPUT_YEAR"); fi
          if [ -n "$INPUT_MONTH" ]; then args+=(--month "$INPUT_MONTH"); fi
          python edogawa_stadium_gemini.py "${args[@]}"
      - name: Upload JSON result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edogawa-stadium-events
          path: edogawa_stadium_events.json
          if-no-files-found: warn
          retention-days: 30
