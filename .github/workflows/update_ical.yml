name: Update Edogawa Events iCal

on:
  schedule:
    - cron: "0 21 * * *" # 06:00 JST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: edogawa-events-ical
  cancel-in-progress: false

jobs:
  build-ical:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify application version and quality filters
        run: |
          python - <<'PY'
          import pathlib, edogawa_ical
          print("Loaded module:", pathlib.Path(edogawa_ical.__file__).resolve())
          print("Application version:", getattr(edogawa_ical, "APP_VERSION", "MISSING"))
          required = ("is_non_event_page", "valid_event_span", "make_event", "extract_detail", "outside_facility_mention", "geocode_edogawa_location", "expand_recurring_spans")
          missing = [name for name in required if not hasattr(edogawa_ical, name)]
          if missing:
              raise SystemExit("Required v3 functions are missing: " + ", ".join(missing))
          if getattr(edogawa_ical, "APP_VERSION", None) != "3.2.1":
              raise SystemExit("Wrong edogawa_ical.py loaded. Replace the repository-root file with v3.2.1.")
          PY

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Generate iCal and map JSON
        env:
          KVIEWER_API_URL: ${{ secrets.KVIEWER_API_URL }}
        run: python -u edogawa_ical.py --months 12

      - name: Upload source diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edogawa-ical-diagnostics
          path: |
            source_status.json
            edogawa_events.ics
            edogawa_events.json
            edogawa_venues.json
          if-no-files-found: warn
          retention-days: 14

      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add edogawa_events.ics edogawa_events.json source_status.json edogawa_venues.json
          if git diff --cached --quiet; then
            echo "No calendar data changes"
          else
            git commit -m "Update Edogawa events calendar"
            git push
          fi
