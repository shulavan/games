name: Update Edogawa Events iCal
​on:
schedule:
# 毎日 21:00 UTC = 翌朝 06:00 JST（日本時間）に自動実行
- cron: '0 21 * * *'
workflow_dispatch:
​permissions:
contents: write
​jobs:
build-ical:
runs-on: ubuntu-latest
steps:
- name: Checkout repository
uses: actions/checkout@v4
​- name: Set up Python
uses: actions/setup-python@v5
with:
python-version: '3.11'
​- name: Install dependencies
run: |
pip install requests beautifulsoup4 playwright
playwright install chromium --with-deps
​- name: Run Edogawa event scraper
run: python edogawa_ical.py
​- name: Commit and push updated iCal file
run: |
git config --local user.email "github-actions[bot]@users.noreply.github.com"
git config --local user.name "github-actions[bot]"
git add edogawa_events.ics
git diff --staged --quiet || git commit -m "chore: update edogawa_events.ics"
git push
