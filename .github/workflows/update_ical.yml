name: Update Edogawa Events iCal

on:
  schedule:
    - cron: "0 21 * * *" # 06:00 JST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: edogawa-events-ical
  cancel-in-progress: false

jobs:
  build-ical:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify application version
        run: |
          python - <<'PY'
          import pathlib, edogawa_ical
          print("Loaded module:", pathlib.Path(edogawa_ical.__file__).resolve())
          print("Application version:", edogawa_ical.APP_VERSION)
          if edogawa_ical.APP_VERSION != "3.2.15":
              raise SystemExit("Wrong edogawa_ical.py loaded; expected v3.2.15")
          import edogawa_stadium_gemini
          required = ("expand_recurring_spans", "extract_detail", "is_non_event_page",
                      "verify_edogawa_location", "geocode_edogawa_location", "atomic_write_bundle",
                      "normalize_event_url", "merge_events", "clean_location_text", "clean_description_text", "combine_location",
                      "parse_cultural_center_calendar", "parse_ecocenter_listing", "parse_library_event_listing",
                      "parse_athletics_news_listing", "parse_asahi_startup_course", "collapse_weekly_period_spans")
          missing = [name for name in required if not hasattr(edogawa_ical, name)]
          if missing:
              raise SystemExit("Required v3.2.15 functions are missing: " + ", ".join(missing))
          PY

      - name: Unit tests (Python 3.12)
        run: python -m unittest discover -s tests -v

      - name: Generate iCal and map JSON
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -u edogawa_ical.py --months 12

      - name: Verify generated files are from the same run
        run: |
          python - <<'PY'
          import json, pathlib, re
          status = json.loads(pathlib.Path("source_status.json").read_text(encoding="utf-8"))
          data = json.loads(pathlib.Path("edogawa_events.json").read_text(encoding="utf-8"))
          ics = pathlib.Path("edogawa_events.ics").read_text(encoding="utf-8")
          expected = ("3.2.15", status.get("execution_id"), status.get("generated_at"))
          actual = (data.get("app_version"), data.get("execution_id"), data.get("generated_at"))
          if expected != actual:
              raise SystemExit(f"JSON/status generation mismatch: {actual!r} != {expected!r}")
          if status.get("app_version") != "3.2.15":
              raise SystemExit("source_status.json version mismatch")
          for marker in (f"PRODID:-//Edogawa Ward Events//JP v3.2.15//EN",
                         f"X-EDOGAWA-EXECUTION-ID:{status['execution_id']}",
                         f"X-EDOGAWA-GENERATED-AT:{status['generated_at']}"):
              if marker not in ics:
                  raise SystemExit("iCal/status generation mismatch: " + marker)
          print("Verified v3.2.15 generation:", status["execution_id"], status["generated_at"])
          print("Events:", status.get("totals", {}).get("unique_events"))
          PY

      - name: Upload source diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edogawa-ical-diagnostics
          path: |
            source_status.json
            source_status_failed.json
            edogawa_events.ics
            edogawa_events.json
            edogawa_venues.json
          if-no-files-found: warn
          retention-days: 14

      - name: Commit all generated outputs together
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add edogawa_events.ics edogawa_events.json source_status.json edogawa_venues.json
          if git diff --cached --quiet; then
            echo "No calendar data changes"
          else
            git commit -m "Update Edogawa events calendar (v3.2.15)"
            git push
          fi
