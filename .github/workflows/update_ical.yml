name: Update Edogawa Events iCal
on:
schedule:
- cron: '0 21 * * *'
workflow_dispatch:
permissions:
contents: write
jobs:
build-ical:
runs-on: ubuntu-latest
steps:
- uses: actions/checkout@v4
- uses: actions/setup-python@v5
with:
python-version: '3.11'
- run: pip install requests beautifulsoup4 playwright && playwright install chromium --with-deps
- run: python edogawa_ical.py
- run: git config --local user.email "github-actions[bot]@users.noreply.github.com" && git config --local user.name "github-actions[bot]" && git add edogawa_events.ics && (git diff --staged --quiet || git commit -m "chore: update edogawa_events.ics") && git push
